[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qqiangwei-nlp_jd095"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出NLP 算法工程师·灰度发布与版本回滚上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "qqiangwei" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://qqiangwei.github.io"
Repository = "https://github.com/qqiangwei/nlp_jd095"
Issues = "https://github.com/qqiangwei/nlp_jd095/issues"

[project.scripts]
nlp_jd095 = "nlp_jd095:main"

[tool.setuptools]
py-modules = ["nlp_jd095"]
